name: Laptop Deal Watcher Tests

on:
  push:
    branches:
      - feat/laptop-deal-watcher
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            loguru==0.7.0 \
            pydantic==2.9.2 \
            'requests[socks]==2.32.3' \
            tomli_w==1.2.0

      - name: Compile watcher modules
        run: |
          python -m py_compile \
            deal_watcher/*.py \
            deal_watcher_runner.py \
            deal_feed_runner.py \
            deal_webhook_ingress.py \
            deal_phone_ingress.py \
            deal_health_monitor.py \
            deal_alert_relay.py \
            deal_external_watchdog.py \
            deal_queue_admin.py \
            parser/http/client.py \
            tests/*.py

      - name: Run unit and acceptance tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python -m unittest discover -s tests -v

  android-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build, lint, and test Android client
        working-directory: android_client
        run: |
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: avito-push-bridge-debug
          path: android_client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
