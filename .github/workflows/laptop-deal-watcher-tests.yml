name: Laptop Deal Watcher Tests

on:
  push:
    branches:
      - feat/laptop-deal-watcher
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile watcher modules
        run: |
          python -m py_compile deal_watcher/*.py deal_watcher_runner.py tests/test_deal_watcher.py

      - name: Run unit tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python -m unittest discover -s tests -v
