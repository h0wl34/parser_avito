[deal_watcher]
enabled = true
notify_score = 80
market_window_days = 30
min_market_samples = 5
# Prevent an old Telegram/outage backlog from flooding after recovery. Events are
# still analyzed/stored, but FAST delivery is suppressed after this queue age.
max_fast_event_age_seconds = 7200
database_path = "database.db"

[safety]
enabled = true
require_anonymous = true
disable_enrichment_requests = true
stop_on_block = true
# Production default: do not poll Avito directly. Use deal_feed_runner.py.
allow_direct_avito_requests = false
# These limits apply only if direct polling is explicitly enabled for diagnostics.
min_profile_interval_seconds = 900
max_requests_per_hour = 12
interval_jitter_ratio = 0.20
startup_spread_seconds = 900
cooldown_after_block_seconds = 86400
max_cooldown_after_block_seconds = 604800
block_backoff_multiplier = 2.0
block_statuses = [403, 429, 439]

[health]
enabled = true
# A single timeout should not wake the user. Persistent failures must survive
# both the minimum time window and the consecutive-check threshold.
check_interval_seconds = 30
failure_grace_seconds = 120
consecutive_failures = 3
# While an incident stays active, remind at most once every six hours.
repeat_alert_seconds = 21600
# Feed/webhook heartbeats are emitted every ~30s. Heartbeat timeout itself is
# already the grace period for process death; the health monitor therefore does
# not add failure_grace_seconds again for these two process-heartbeat incidents.
# Three consecutive stale observations still have to agree before alerting.
worker_heartbeat_timeout_seconds = 90
ingress_heartbeat_timeout_seconds = 90
telegram_probe_seconds = 60
# Queue/dead-letter health thresholds.
queue_oldest_pending_seconds = 600
queue_pending_warning = 25
dead_letter_critical = 1
# Disk thresholds are MiB.
disk_free_warning_mb = 1024
disk_free_critical_mb = 256
# Emergency relay connection details are read from environment variables, never
# committed to TOML. The relay is independent of the normal SOCKS notifier.
relay_url_env = "DEAL_ALERT_RELAY_URL"
relay_secret_env = "DEAL_ALERT_RELAY_SECRET"

